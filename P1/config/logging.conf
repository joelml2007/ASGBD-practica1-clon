# -------------------------------------------------------------
# Requisito 6: Trazabilidad (Logging persistente)
# -------------------------------------------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Registrar conexiones, desconexiones e intentos fallidos
log_connections = on
log_disconnections = on

# Nivel de detalle para capturar rechazos de pg_hba y autenticación
log_min_messages = warning